<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#463724;--paper:#fffaf0;--accent:#aa4b29;--banner-height:0px}
*{box-sizing:border-box}body{margin:0;padding-top:var(--banner-height);background:#f6efdf;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
button,input,textarea{font:inherit}button{border:1px solid #b15837;border-radius:14px;background:#aa4b29;color:#fffaf0;padding:12px 20px;cursor:pointer;font-weight:650;min-height:48px}button:hover{background:#873c23}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #33795e;outline-offset:4px}
[hidden]{display:none!important}#preview-banner{position:fixed;top:0;left:0;right:0;z-index:2;text-align:center;background:#ffe0ad;color:#613714;padding:10px 14px;font-weight:700;box-shadow:0 2px 8px #79552a20}
.shell{max-width:928px;margin:auto;min-height:calc(100svh - var(--banner-height));padding:0 24px;display:flex;flex-direction:column}.site-header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px 0;font-size:14px;letter-spacing:.1em;color:#77684d}.site-header strong{color:#68492e}.site-header span{letter-spacing:0}main{flex:1;min-width:0}.page{background:var(--paper);border:1px solid #e7dbc7;border-radius:24px;padding:30px;box-shadow:0 8px 30px #8067430b;overflow-wrap:anywhere}.eyebrow{font-size:14px;letter-spacing:.06em;color:#82694b;margin:0 0 20px}.cover{text-align:center;min-height:610px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:50px 30px}.cover-mark{width:100px;height:100px;border-radius:30px;background:#f6ce81;color:#7b5229;display:grid;place-items:center;font-size:64px;font-weight:800;transform:rotate(-6deg);margin:8px auto 24px}h1{font-size:clamp(32px,5vw,54px);line-height:1.25;margin:16px 0 28px}h2{font-size:clamp(26px,4vw,38px);line-height:1.5;margin:12px 0 26px}h3{font-size:19px;margin-top:26px}.question{font-size:24px;margin:0 0 28px}.guide{padding:16px 24px;border-radius:18px;background:#f8ecd7;font-size:20px}.guide p{margin:4px 0}.hint{font-size:16px;color:#836f54;margin-top:26px}
.picture{width:100%;aspect-ratio:3/2;background:#f5ead7;border:1px solid #ead9bd;border-radius:16px;overflow:hidden;display:grid;place-items:center}.picture img,.picture svg{display:block;width:100%;height:100%;object-fit:contain;min-width:0;min-height:0}.placeholder{padding:24px;text-align:center;max-width:600px;font-size:clamp(17px,2.4vw,23px);line-height:1.75}.placeholder span{font-size:13px;letter-spacing:.1em;color:#967c59}.placeholder p{margin:12px 0 0}.narration{font-size:clamp(22px,3vw,28px);line-height:1.85;margin:24px 0 18px}.english{color:#75624b}.read-button{background:transparent;color:#884428;font-size:18px}.read-button:hover{color:#fff}.speech-status{font-size:14px;margin:6px 0 0;color:#806849}.speech-status:empty{display:none}.child-page h2{max-width:700px}.field-label{display:block;font-size:18px;margin:20px 0 8px}textarea{display:block;width:100%;resize:vertical;min-height:100px;border:1px solid #cdbd9f;border-radius:14px;padding:16px;background:#fffdf7;color:var(--ink);font-size:20px;line-height:1.7}textarea:focus{outline:2px solid #bd7742;outline-offset:2px}fieldset{margin:28px 0 0;border:1px solid #e3d6bf;border-radius:14px;padding:14px}legend{padding:0 8px;font-size:16px}.reactions{display:flex;flex-wrap:wrap;gap:8px 18px}.reactions label{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;font-size:18px}.reactions input{accent-color:#aa4b29;width:18px;height:18px}#export-feedback{margin-top:24px}#save-status{font-size:15px}.parent-card{margin-top:28px;border-top:1px solid #dfd1b8;padding-top:20px;font-size:16px}.parent-card summary{cursor:pointer;font-size:19px;font-weight:700;min-height:44px}.parent-card p,.parent-card li{white-space:pre-wrap}.parent-card li{margin-bottom:12px}.parent-card a{color:#80512c;word-break:break-word}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 24px}footer button{background:#fff8eb;color:#74492a;border-color:#cbb696}footer button:hover{background:#eeddbd}#page-count{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:600px){.shell{padding:0 12px}.site-header{padding:15px 4px;font-size:12px}.page{padding:20px;border-radius:18px}.cover{min-height:560px;padding:30px 22px}.question{font-size:22px}.guide{font-size:20px;padding:14px}.picture{border-radius:12px}.placeholder{padding:12px;font-size:16px;line-height:1.6}.placeholder p{margin-top:6px}.placeholder span{font-size:11px}.narration{font-size:22px;margin-top:20px}.eyebrow{font-size:12px;margin-bottom:16px}footer{padding:16px 0 20px;gap:8px}footer button{padding:10px 16px;font-size:16px}#page-count{font-size:16px}.parent-card ul{padding-left:22px}}
.question-note{font-size:16px;color:#836f54;margin:-16px 0 28px}
.age-band{font-size:14px;color:#836f54;margin:0 0 20px}.co-reading-hint{font-size:13px;line-height:1.5;color:#9b8b77;margin:0 0 12px}.ai-notice{color:#75624b}
.child-page .eyebrow{margin-bottom:8px}.child-page h2{font-size:clamp(26px,3vw,30px);line-height:1.4;margin:8px 0 16px}.child-page label[for="child-words"]{font-size:16px;margin:12px 0 8px}#child-words{min-height:140px;padding:12px;line-height:1.5}.follow-prompts{margin-top:20px}.follow-prompts>p{font-size:14px;color:#836f54;margin:0 0 8px}.follow-buttons{display:flex;flex-wrap:wrap;gap:8px}.follow-button{font-size:16px;font-weight:500;line-height:1.5;min-height:44px;padding:8px 14px;text-align:left;background:#f8f1e4;color:#75624b;border-color:#dacbb3;max-width:100%}.follow-button:hover{background:#eedfc5;color:#68492e}.follow-button[aria-pressed="true"]{background:#e2ecdd;color:#355b3f;border-color:#7b9b78}.follow-button:focus-visible{outline:3px solid #33795e;outline-offset:3px}
@media(min-width:768px) and (min-height:680px){.story .picture{width:min(100%,880px,var(--picture-width,880px));margin-inline:auto;min-height:0}}
@media(min-width:768px) and (min-height:680px) and (max-height:800px){.child-page{padding:20px}.child-page h2{font-size:26px;line-height:1.35;margin-bottom:12px}.child-page label[for="child-words"]{margin-top:8px}#child-words{height:clamp(100px,calc(100svh - var(--banner-height) - 550px),140px);min-height:100px}.follow-prompts{margin-top:16px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}
</style>
</head>
<body>
{{BANNER}}
<div class="shell"><header class="site-header"><strong>好奇心工地</strong><span>一本从你的问题出发的书</span></header>
<main id="book-pages">{{PAGES}}</main>
<footer aria-label="翻页"><button type="button" id="previous" disabled>← 上一页</button><span id="page-count" aria-live="polite">1 / {{TOTAL}}</span><button type="button" id="next">下一页 →</button></footer>
</div>
<script id="book-data" type="application/json">{{DATA}}</script>
<script>
(() => {
  'use strict';
  const book = JSON.parse(document.getElementById('book-data').textContent);
  const pages = [...document.querySelectorAll('.page')];
  const previous = document.getElementById('previous'), next = document.getElementById('next');
  const childWords = document.getElementById('child-words'), parentNote = document.getElementById('parent-note');
  let current = 0, selected = new Set();
  function fitStory() {
    const page = pages[current], picture = page.querySelector('.picture');
    if (!picture) return;
    if (window.innerWidth < 768 || window.innerHeight < 680) {
      picture.style.removeProperty('--picture-width'); return;
    }
    // Measure the text and controls at their full content width. Only the
    // illustration shrinks, keeping its 3:2 ratio and both navigation buttons.
    const rect = page.getBoundingClientRect();
    const otherHeight = rect.height - picture.getBoundingClientRect().height;
    const footerHeight = document.querySelector('footer').getBoundingClientRect().height;
    const availableHeight = window.innerHeight - (rect.top + window.scrollY) - otherHeight - footerHeight - 2;
    picture.style.setProperty('--picture-width', `${Math.max(0, availableHeight) * 1.5}px`);
  }
  window.addEventListener('resize', fitStory);
  if ('ResizeObserver' in window) {
    // Narration, speech status and preview banner can change after a page turn.
    const observer = new ResizeObserver(fitStory);
    document.querySelectorAll('.narration,.co-reading-hint,.speech-status,.eyebrow,.read-button,.site-header,footer').forEach(element => observer.observe(element));
  }
  try {
    const stored = JSON.parse(localStorage.getItem(book.storageKey) || '{}');
    if (Array.isArray(stored.followUps)) selected = new Set(stored.followUps.filter(i => Number.isInteger(i) && i >= 0 && i < book.followUps.length));
    if (typeof stored.childWords === 'string') childWords.value = stored.childWords;
    if (typeof stored.parentNote === 'string') parentNote.value = stored.parentNote;
    document.querySelectorAll('input[name="reaction"]').forEach(radio => { radio.checked = stored.reaction === radio.value; });
  } catch (_) { /* Some file:// browsers deny storage; reading and export still work. */ }
  function reaction() { return document.querySelector('input[name="reaction"]:checked')?.value || ''; }
  function persist() {
    try { localStorage.setItem(book.storageKey, JSON.stringify({followUps: [...selected], childWords: childWords.value, reaction: reaction(), parentNote: parentNote.value})); }
    catch (_) { /* Keep the current session usable if storage is unavailable. */ }
  }
  function updateFollowButtons() {
    document.querySelectorAll('[data-follow]').forEach(button => {
      const tapped = selected.has(Number(button.dataset.follow));
      button.setAttribute('aria-pressed', String(tapped));
      const question = book.followUps[Number(button.dataset.follow)];
      button.textContent = tapped ? `已选 · ${question}` : question;
    });
  }
  updateFollowButtons();
  document.querySelectorAll('[data-follow]').forEach(button => button.addEventListener('click', () => {
    selected.add(Number(button.dataset.follow)); updateFollowButtons(); persist();
  }));
  function go(index) {
    if (index < 0 || index >= pages.length || index === current) return;
    stopReading();
    pages[current].hidden = true; current = index; pages[current].hidden = false;
    previous.disabled = current === 0; next.disabled = current === pages.length - 1;
    document.getElementById('page-count').textContent = `${current + 1} / ${pages.length}`;
    fitStory();
    window.scrollTo({top: 0, behavior: 'instant'});
  }
  previous.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
        event.target.closest('input,textarea,select,[contenteditable]')) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault(); go(current + (event.key === 'ArrowRight' ? 1 : -1));
    }
  });
  let touchStart = null;
  const main = document.getElementById('book-pages');
  main.addEventListener('touchstart', event => {
    touchStart = event.touches.length === 1 && !event.target.closest('textarea,input,button,a,summary')
      ? {x: event.touches[0].clientX, y: event.touches[0].clientY} : null;
  }, {passive: true});
  main.addEventListener('touchend', event => {
    if (!touchStart || !event.changedTouches.length) return;
    const dx = event.changedTouches[0].clientX - touchStart.x, dy = event.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
  }, {passive: true});
  main.addEventListener('touchcancel', () => { touchStart = null; }, {passive: true});
  let readingButton = null, recording = null, readingToken = 0;
  function stopReading() {
    // Invalidate callbacks before cancel/pause: late completion must never
    // start the next bilingual line after stopping or changing the page.
    readingToken++;
    if (recording) {
      recording.onended = recording.onerror = null;
      recording.pause(); recording.currentTime = 0; recording = null;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (readingButton) {
      readingButton.textContent = '读给我听';
      readingButton.nextElementSibling.textContent = '';
      readingButton = null;
    }
  }
  document.querySelectorAll('[data-read]').forEach(button => button.addEventListener('click', () => {
    if (readingButton === button) { stopReading(); return; }
    stopReading(); readingButton = button; button.textContent = '停止朗读';
    const status = button.nextElementSibling, token = readingToken;
    const lines = book.narrations[button.dataset.read];
    const active = () => token === readingToken && readingButton === button;
    function finish(message = '') {
      if (!active()) return;
      stopReading(); status.textContent = message; fitStory();
    }
    function read(index) {
      if (!active()) return;
      if (index >= lines.length) { finish(); return; }
      const line = lines[index];
      if (line.audio && 'Audio' in window) {
        const audio = new window.Audio(line.audio); recording = audio;
        let fellBack = false;
        function fallback() {
          if (!active() || fellBack) return;
          fellBack = true; audio.onended = audio.onerror = null;
          audio.pause(); recording = null; speak(index);
        }
        audio.onended = () => { if (active() && !fellBack) { recording = null; read(index + 1); } };
        audio.onerror = fallback;
        status.textContent = '正在读给你听……';
        try {
          const playing = audio.play();
          if (playing && playing.catch) playing.catch(fallback);
        } catch (_) { fallback(); }
        return;
      }
      speak(index);
    }
    function speak(index) {
      if (!active()) return;
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        finish('这个浏览器暂不支持朗读，可以请爸爸妈妈读给你听。'); return;
      }
      const line = lines[index];
      const utterance = new SpeechSynthesisUtterance(line.text);
      utterance.lang = line.lang; utterance.rate = 0.9;
      const voices = window.speechSynthesis.getVoices();
      const matching = voices.filter(v => v.lang.replace(/_/g, '-').toLowerCase().startsWith(line.lang === 'zh-CN' ? 'zh' : 'en'));
      const voice = (line.lang === 'zh-CN' && matching.find(v => /Xiaoxiao|晓晓|Tingting|婷婷/i.test(v.name))) ||
        matching.find(v => v.lang.replace(/_/g, '-').toLowerCase() === line.lang.toLowerCase()) || matching[0];
      if (voice) utterance.voice = voice;
      utterance.onstart = () => { if (active()) status.textContent = '正在读给你听……'; };
      utterance.onend = () => { if (active()) read(index + 1); };
      utterance.onerror = event => { if (active()) finish(['canceled','interrupted'].includes(event.error) ? '' : '朗读暂时不可用，请检查系统语音。'); };
      window.speechSynthesis.speak(utterance);
    }
    read(0);
  }));
  childWords.addEventListener('input', persist); parentNote.addEventListener('input', persist);
  document.querySelectorAll('input[name="reaction"]').forEach(radio => radio.addEventListener('change', persist));
  document.getElementById('export-feedback').addEventListener('click', () => {
    persist(); const today = new Date();
    const date = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const feedback = {book_title: book.title, question: book.question, date,
      follow_ups_tapped: book.followUps.filter((_, i) => selected.has(i)), child_words: childWords.value,
      reaction: reaction(), parent_note: parentNote.value};
    const url = URL.createObjectURL(new Blob([JSON.stringify(feedback, null, 2)], {type:'application/json;charset=utf-8'}));
    const link = document.createElement('a'); link.href = url; link.download = 'feedback.json';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    document.getElementById('save-status').textContent = '反馈已导出为 feedback.json。';
  });
  const banner = document.getElementById('preview-banner');
  if (banner) {
    const resize = () => {
      document.documentElement.style.setProperty('--banner-height', `${banner.getBoundingClientRect().height}px`);
      fitStory();
    };
    resize(); if ('ResizeObserver' in window) new ResizeObserver(resize).observe(banner);
    else window.addEventListener('resize', resize);
  }
  fitStory();
})();
</script>
</body>
</html>
