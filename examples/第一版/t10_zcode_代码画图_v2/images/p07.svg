  <circle cx="1091" cy="360" r="22" fill="#E86A4F"/>
  <rect x="1087" y="306" width="8" height="52" fill="#E86A4F"/>
  <line x1="1064" y1="230" x2="1076" y2="230" stroke="#9FB8CC" stroke-width="4"/>
