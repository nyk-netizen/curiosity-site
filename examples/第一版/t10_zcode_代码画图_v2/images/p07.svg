  <!-- 小方（竖大拇指） -->
  <use xlink:href="#guide" href="#guide" transform="translate(700 660) scale(1.3)"/>
  <circle cx="928" cy="778" r="16" fill="#3E7BC4"/>
  <rect x="936" y="746" width="13" height="28" rx="6" fill="#3E7BC4"/>
