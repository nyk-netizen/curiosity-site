    <ellipse cx="1120" cy="580" rx="46" ry="54" fill="#D4574C"/>
    <ellipse cx="1220" cy="590" rx="42" ry="50" fill="#D4574C"/>
    <ellipse cx="1270" cy="560" rx="36" ry="44" fill="#E9705F"/>
