    <rect x="880" y="150" width="540" height="700" rx="26" fill="#DCE9F3"/>
  </g>
  <g filter="url(#cut)">
    <rect x="912" y="182" width="476" height="636" rx="18" fill="#F7F3EA"/>
  </g>
  <g filter="url(#cut)">
    <rect x="912" y="430" width="476" height="26" rx="10" fill="#DCE9F3"/>
  </g>
  <g filter="url(#cut)">
    <path d="M1010,400 C1002,344 1036,312 1078,312 C1120,312 1154,344 1146,400 C1141,430 1116,442 1078,442 C1040,442 1015,430 1010,400 Z" fill="#D4574C"/>
