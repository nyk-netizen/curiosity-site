    <rect x="60" y="640" width="620" height="190" rx="20" fill="#E9DCC2"/>
  </g>
  <g filter="url(#cut)">
    <ellipse cx="360" cy="640" rx="230" ry="42" fill="#F8E6BE"/>
  </g>
  <g filter="url(#cut)">
    <path d="M230,600 C220,520 270,470 330,470 C390,470 440,520 430,600 C425,640 390,655 330,655 C270,655 235,640 230,600 Z" fill="#D4574C"/>
    <path d="M305,470 C315,440 345,430 360,442 C350,466 325,472 305,470 Z" fill="#7FA86A"/>
  </g>
  <g filter="url(#cut)">
    <path d="M420,610 C414,560 445,528 485,528 C525,528 556,560 550,610 C546,638 520,648 485,648 C450,648 424,638 420,610 Z" fill="#D4574C"/>
    <path d="M470,528 C478,508 498,502 508,510 C500,528 482,532 470,528 Z" fill="#7FA86A"/>
  </g>
