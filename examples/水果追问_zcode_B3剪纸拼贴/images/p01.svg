  <!-- 标注 -->
  <text x="180" y="140" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="54" font-weight="bold" fill="#4A3B2C">桌上</text>
  <text x="1000" y="140" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="54" font-weight="bold" fill="#4A3B2C">冰箱里</text>

  <!-- 小方在中间比较 -->
  <g filter="url(#cut)"><use xlink:href="#guide" href="#guide" transform="translate(760 790) scale(0.82)"/></g>
